name: Boost top post

# Автозапуск отключён 28.09 — вместе со снижением частоты в post.yml, после
# того как недельная сводка Threads показала падение просмотров с 8228 до 317
# (-96%) на фоне резкого роста числа публикаций. Буст остаётся доступен вручную
# через workflow_dispatch (например, кнопкой в Actions), пока охват не
# восстановится и не станет ясно, стоит ли включать его снова по расписанию.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только проверка, без публикации"
        type: boolean
        default: false

concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Boost
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || vars.TG_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python boost.py --dry-run
          else
            python boost.py
          fi
      - name: Save state and log
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add state.json logs 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "boost $(date -u +%F_%H%M)" && git pull --rebase && git push)
