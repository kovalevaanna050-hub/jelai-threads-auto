name: Daily views report

on:
  schedule:
    - cron: "50 0 * * *"  # 07:50 Сайгон
  workflow_dispatch:

concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Report
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || vars.TG_CHAT_ID }}
        run: python report.py
      - name: Save state
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "report $(date -u +%F_%H%M)" && git pull --rebase && git push)
