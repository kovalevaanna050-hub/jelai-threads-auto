name: Post to Threads

# ПОЛНАЯ ПАУЗА с 29.09 — недельная сводка Threads (22-29.09) показала 316
# просмотров на 83 публикации, тогда как неделей раньше 7 публикаций собрали
# 2767 просмотров (в 8 раз больше на пост). Threads резко срезал охват всему
# аккаунту, распознав паттерн бота (частые публикации по расписанию + буст).
# Снижение до 1 раза в день 28.09 не успело отработать (недельное окно ещё
# почти целиком состоит из старых агрессивных дней) — по просьбе владельца
# автопостинг остановлен полностью, чтобы дать аккаунту сигнал "это не бот"
# и не усугублять блокировку охвата. Публикация возможна только вручную через
# workflow_dispatch (кнопка Run workflow в Actions).

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "morning, midday или evening"
        required: true
        default: evening
      dry_run:
        description: "Только проверка, без публикации"
        type: boolean
        default: true
      count:
        description: "Сколько постов"
        required: false
        default: "5"

concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || vars.TG_CHAT_ID }}
          POST_COUNT: ${{ vars.POST_COUNT || '5' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "40 0 * * *") SLOT=morning ;;
              "10 6 * * *") SLOT=midday ;;
              *) SLOT=evening ;;
            esac
            python post.py "$SLOT"
          else
            FLAGS="--no-wait --count ${{ inputs.count }}"
            [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="--dry-run --count ${{ inputs.count }}"
            python post.py "${{ inputs.slot }}" $FLAGS
          fi
      - name: Save state and log
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add state.json logs 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "post $(date -u +%F_%H%M)" && git pull --rebase && git push)
